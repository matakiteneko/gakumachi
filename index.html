    .meta {

      margin-top: 8px;

    .meta p {

    a {

    const search = document.getElementById("search");
    const industry = document.getElementById("industry");
    const region = document.getElementById("region");
    const list = document.getElementById("list");
    const count = document.getElementById("count");

    function showCompanies() {
      const keyword = search.value.trim().toLowerCase();
      const selectedIndustry = industry.value;
      const selectedRegion = region.value;

      const filtered = companies.filter(company => {
        const text = [company.name, company.address, company.info, company.business, company.region].join(" ").toLowerCase();
        return text.includes(keyword)
          && (!selectedIndustry || company.industry === selectedIndustry)
          && (!selectedRegion || company.region === selectedRegion);
      }).sort((a, b) => {
        const regionOrder = a.region.localeCompare(b.region, "ja");
        return regionOrder !== 0 ? regionOrder : a.name.localeCompare(b.name, "ja");
      });

      list.replaceChildren();
      count.textContent = `${filtered.length}社の企業が見つかりました`;

      filtered.forEach(company => {
        const card = document.createElement("div");
        card.className = "company";

        const button = document.createElement("button");
        button.type = "button";
        button.textContent = "＋ " + company.name;

        const detail = document.createElement("div");
        detail.className = "detail";
        detail.hidden = true;

        const meta = document.createElement("div");
        meta.className = "meta";

        const address = document.createElement("p");
        address.textContent = "所在地：" + company.address;

        const type = document.createElement("p");
        type.textContent = "業種：" + company.industry;

        const regionInfo = document.createElement("p");
        regionInfo.textContent = "地域：" + company.region;

        const founded = document.createElement("p");
        founded.textContent = "設立：" + company.founded;

        const employees = document.createElement("p");
        employees.textContent = "従業員数：" + company.employees;

        const business = document.createElement("p");
        business.textContent = "事業内容：" + company.business;

        const contact = document.createElement("p");
        contact.textContent = "お問い合わせ：" + company.contact;

        const website = document.createElement("p");
        const link = document.createElement("a");
        link.href = company.website;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "公式サイト";
        website.append("公式サイト：", link);

        meta.append(address, type, regionInfo, founded, employees, business, contact, website);

        detail.append(meta);

        button.addEventListener("click", () => {
          detail.hidden = !detail.hidden;
          button.textContent = (detail.hidden ? "＋ " : "－ ") + company.name;
        });

        card.append(button, detail);
        list.append(card);
      });
    }

    search.addEventListener("input", showCompanies);
    industry.addEventListener("change", showCompanies);
    region.addEventListener("change", showCompanies);
