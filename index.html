<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>はじめてのホームページ</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 640px;
      margin: 0 auto;
      padding: 32px 20px;
      line-height: 1.8;
      color: #222;
    }
    h1 {
      border-bottom: 3px solid #4a9;
      padding-bottom: 8px;
    }
    .card {
      background: #f4f7f6;
      border-radius: 10px;
      padding: 16px 20px;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <h1>ガクマチ</h1>
  <p>これは自分で作って、自分で公開したページです。</p>

  <div class="card">
    <h2>好きなもの</h2>
    <ul>
      <li>敦賀高校</li>
      <li>２－２</li>
      <li>またきてねこ</li>
    </ul>
  </div>

  <p>9月16日</p>
</body>
</html>
